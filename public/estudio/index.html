<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Estudio de audiolibros</title>
<style>
  :root { --bg:#0e1116; --card:#171b22; --line:#262c36; --fg:#e6e9ef; --mut:#9aa4b2;
          --acc:#6ea8fe; --ok:#3fb950; --err:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 80px; }
  h1 { font-size:1.4rem; margin:.2em 0 .1em; }
  .sub { color:var(--mut); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:16px; margin-bottom:16px; }
  h2 { font-size:.85rem; text-transform:uppercase; letter-spacing:.06em;
       color:var(--mut); margin:0 0 12px; }
  label { display:block; font-size:.85rem; color:var(--mut); margin:10px 0 4px; }
  input, select, button { font:inherit; width:100%; padding:11px 12px; border-radius:10px;
       border:1px solid var(--line); background:#0f1319; color:var(--fg); }
  input[type=file] { padding:9px; }
  button { background:var(--acc); color:#08111f; border:none; font-weight:600; cursor:pointer;
       margin-top:14px; }
  button.sec { background:transparent; color:var(--fg); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  .muted { color:var(--mut); font-size:.85rem; }
  .voz { display:flex; align-items:center; gap:10px; font-weight:600; }
  .voz .dot { width:10px; height:10px; border-radius:50%; background:var(--ok); }
  .estado { font-weight:600; margin:0 0 4px; }
  .stats { display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:10px; color:var(--mut);
           font-size:.9rem; font-variant-numeric:tabular-nums; }
  .stats b { color:var(--fg); font-weight:600; }
  a.dl { display:block; text-align:center; text-decoration:none; background:var(--ok);
         color:#04140a; font-weight:700; padding:12px; border-radius:10px; margin-top:14px; }
  .barra { height:10px; background:#0f1319; border-radius:6px; overflow:hidden; margin-top:10px; }
  .barra > i { display:block; height:100%; background:var(--acc); width:0; transition:width .5s; }
  .barra.anim > i { background:linear-gradient(90deg,var(--acc),#9ec5ff,var(--acc));
                    background-size:200% 100%; animation:sh 1.6s linear infinite; }
  @keyframes sh { to { background-position:-200% 0; } }
  pre { white-space:pre-wrap; font-size:.8rem; color:var(--err); background:#0f1319;
        border-radius:8px; padding:10px; max-height:200px; overflow:auto; }
  details summary { cursor:pointer; color:var(--mut); font-size:.85rem; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ Estudio de audiolibros</h1>
  <p class="sub">Produce el libro entero en la nube. No necesitas encender el Mac.</p>

  <div class="card">
    <h2>Conexión</h2>
    <label>URL de la API (Modal)</label>
    <input id="endpoint" placeholder="https://…-api.modal.run">
    <label>Clave de acceso</label>
    <input id="token" type="password" placeholder="tu ESTUDIO_TOKEN">
    <button class="sec" id="guardar">Guardar y comprobar</button>
    <p class="muted" id="conx"></p>
  </div>

  <div class="card">
    <h2>Voz del sello</h2>
    <p class="voz"><span class="dot"></span> Tux · acabado natural</p>
    <p class="muted">Todos los audiolibros se narran con esta voz.</p>
  </div>

  <div class="card">
    <h2>Nuevo audiolibro</h2>
    <label>Manuscrito (.md)</label>
    <input id="manuscrito" type="file" accept=".md,.markdown,text/markdown">
    <div class="row">
      <div><label>Título</label><input id="title" placeholder="Modo manual"></div>
      <div><label>Autor</label><input id="author" placeholder="David…"></div>
    </div>
    <label>Formato de salida</label>
    <select id="preset">
      <option value="google">Google Play (recomendado)</option>
      <option value="acx">ACX / Audible</option>
    </select>
    <button id="producir">▶ Producir audiolibro</button>
  </div>

  <div class="card" id="panel" style="display:none">
    <h2 id="panelTit">Progreso</h2>
    <p class="estado" id="estado">—</p>
    <div class="barra" id="barraBox"><i id="barra"></i></div>
    <div class="stats">
      <span id="pistas"></span>
      <span id="tiempo"></span>
      <span id="porcap"></span>
      <span id="eta"></span>
    </div>
    <div id="descarga"></div>
    <button class="sec" id="limpiar" style="display:none">Producir otro</button>
    <details id="errbox" style="display:none"><summary>Ver detalle del error</summary><pre id="err"></pre></details>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const LS = localStorage;
const VOZ = 'ref_tux_limpia.wav';       // voz única del sello
const JOBKEY = 'job';                   // job persistido entre recargas
let job = null; try { job = JSON.parse(LS.getItem(JOBKEY) || 'null'); } catch(e){}
let pollTimer = null, tickTimer = null;

// --- conexión (persistida) ---
$('#endpoint').value = LS.getItem('endpoint') || 'https://davidamigosanchez--estudio-audiolibros-api.modal.run';
$('#token').value    = LS.getItem('token') || '';
const base  = () => ($('#endpoint').value || '').replace(/\/+$/,'');
const token = () => $('#token').value.trim();
const hAuth = () => ({ 'Authorization': 'Bearer ' + token() });

async function api(path, opts={}) {
  const r = await fetch(base()+path, opts);
  if (!r.ok) throw new Error((await r.text()) || ('HTTP '+r.status));
  return r;
}

function fmt(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }

$('#guardar').onclick = async () => {
  LS.setItem('endpoint', $('#endpoint').value);
  LS.setItem('token', $('#token').value);
  $('#conx').textContent = 'Comprobando…';
  try { await api('/salud'); $('#conx').textContent = '✅ Conectado.'; }
  catch(e) { $('#conx').textContent = '❌ ' + e.message; }
};

$('#producir').onclick = async () => {
  const man = $('#manuscrito').files[0];
  if (!man)               return alert('Falta el manuscrito .md');
  if (!$('#title').value) return alert('Falta el título');
  const fd = new FormData();
  fd.append('manuscrito', man);
  fd.append('title', $('#title').value);
  fd.append('author', $('#author').value);
  fd.append('voz', VOZ);
  fd.append('preset', $('#preset').value);
  $('#producir').disabled = true;
  try {
    const r = await api('/crear', { method:'POST', headers: hAuth(), body: fd });
    const { job_id } = await r.json();
    job = { id: job_id, title: $('#title').value, launchedAt: Date.now(), done: false };
    LS.setItem(JOBKEY, JSON.stringify(job));
    arrancar();
  } catch(e) { alert('Error: ' + e.message); }
  $('#producir').disabled = false;
};

$('#limpiar').onclick = () => {
  LS.removeItem(JOBKEY); job = null;
  clearTimeout(pollTimer); clearInterval(tickTimer);
  $('#panel').style.display = 'none';
  $('#descarga').innerHTML = ''; $('#limpiar').style.display = 'none';
  $('#errbox').style.display = 'none';
};

const ETAPAS = { encolado:['En cola…',6], guion:['Preparando el guion…',14],
                 produciendo:['Grabando capítulos…',null],
                 masterizando:['Masterizando…',96], listo:['✅ ¡Listo!',100], error:['❌ Error',100] };

function arrancar(){
  $('#panel').style.display = 'block';
  $('#panelTit').textContent = 'Progreso · ' + (job.title || '');
  $('#descarga').innerHTML = ''; $('#limpiar').style.display = 'none';
  $('#errbox').style.display = 'none';
  if (!job.done) {
    clearInterval(tickTimer);
    tickTimer = setInterval(() => {
      if (job && !job.done) $('#tiempo').textContent = '⏱ ' + fmt((Date.now()-job.launchedAt)/1000);
    }, 1000);
  }
  poll();
}

function render(st){
  const [txt, basePct] = ETAPAS[st.estado] || [st.estado, 50];
  $('#estado').textContent = txt;
  const producing = st.estado === 'produciendo';
  $('#barraBox').classList.toggle('anim', producing || st.estado==='guion' || st.estado==='masterizando');

  // barra
  let pct = basePct;
  if (producing && st.total) pct = 14 + Math.round((st.hechas/st.total)*80);   // 14→94%
  if (pct == null) pct = 40;
  $('#barra').style.width = pct + '%';

  // pistas
  if (st.total) {
    $('#pistas').innerHTML = (st.estado==='listo')
      ? `<b>${st.total}</b> pistas`
      : `Capítulo <b>${Math.min(st.hechas+1, st.total)}</b> de <b>${st.total}</b>`;
  } else { $('#pistas').textContent = ''; }

  // ritmo por capítulo
  $('#porcap').innerHTML = st.seg_por_pista ? `≈ <b>${fmt(st.seg_por_pista)}</b> / capítulo` : '';

  // ETA (solo mientras produce)
  $('#eta').innerHTML = (producing && st.eta_seg>0) ? `faltan ~<b>${fmt(st.eta_seg)}</b>` : '';

  // tiempo final (congelado) cuando termina
  if (st.estado==='listo' && st.tiempo_total_seg!=null)
    $('#tiempo').innerHTML = `⏱ <b>${fmt(st.tiempo_total_seg)}</b> total`;
}

async function poll(){
  if (!job) return;
  try {
    const st = await (await api('/estado/'+job.id, { headers: hAuth() })).json();
    render(st);
    if (st.estado === 'listo' || st.estado === 'error') {
      job.done = true; LS.setItem(JOBKEY, JSON.stringify(job));
      clearInterval(tickTimer); clearTimeout(pollTimer);
      $('#barraBox').classList.remove('anim');
      $('#limpiar').style.display = 'block';
      if (st.estado === 'listo') {
        $('#descarga').innerHTML =
          `<a class="dl" href="${base()}/descargar/${job.id}?token=${encodeURIComponent(token())}">⬇ Descargar audiolibro (.zip)</a>`;
      } else {
        $('#errbox').style.display = 'block';
        $('#err').textContent = st.error || 'desconocido';
      }
      return;
    }
  } catch(e) { /* reintenta */ }
  pollTimer = setTimeout(poll, 8000);
}

// --- reengancha un job en curso al abrir/recargar ---
if (job) arrancar();
</script>
</body>
</html>
